# Active only when SPRING_PROFILES_ACTIVE=render (set in the Render dashboard).
# This is a DEMO deployment WITHOUT Keycloak:
#   - security is relaxed by SecurityConfigRender (@Profile("render"))
#   - the OAuth2 resource-server auto-config is switched off below, so the app
#     does NOT try to contact Keycloak at startup (which would fail on Render).
spring.autoconfigure.exclude=org.springframework.boot.security.oauth2.server.resource.autoconfigure.servlet.OAuth2ResourceServerAutoConfiguration

# Render Postgres connection (values injected from env vars set in the dashboard).
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Quieter logs in the deployed app.
spring.jpa.show-sql=false
